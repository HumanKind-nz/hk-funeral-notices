name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: "Build plugin, publish release and update manifest"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Get the version"
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Build assets"
        run: npm run build

      - name: "Create build directory"
        run: mkdir -p build-release/hk-funeral-notices

      - name: "Copy plugin files to build directory"
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build-release' \
            --exclude='node_modules' \
            --exclude='src/js' \
            --exclude='.gitignore' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='webpack.scripts.config.js' \
            --exclude='phpcs.xml.dist' \
            --exclude='blueprint.json' \
            --exclude='CLAUDE.md' \
            --exclude='PROJECT-STATE-SUMMARY.md' \
            --exclude='ANALYTICS-COLLECTION-EXTENSION.md' \
            --exclude='INCIDENT-REPORT-NOV-21-2025.md' \
            --exclude='COLLECTION-MANAGEMENT-FEATURE.md' \
            --exclude='.DS_Store' \
            --exclude='.nova' \
            --exclude='.claude' \
            --exclude='screenshots' \
            . build-release/hk-funeral-notices/

      - name: "Create zip file"
        run: |
          cd build-release
          zip -r hk-funeral-notices-${{ env.VERSION }}.zip hk-funeral-notices

      # Built before the release so it can be attached to it. Sites read this
      # from the stable .../releases/latest/download/update.json URL, which is a
      # redirect rather than an API call and so is not rate limited. No secrets
      # are involved: the release is published with the built-in GITHUB_TOKEN.
      - name: "Build update manifest"
        run: |
          VERSION_NO_V="${VERSION#v}"
          # Pull the top section out of CHANGELOG.md (first "## [" block).
          CHANGELOG=$(awk '/^## \[/{n++} n==1' CHANGELOG.md)
          jq -n \
            --arg version      "$VERSION_NO_V" \
            --arg download_url "https://github.com/${{ github.repository }}/releases/download/${VERSION}/hk-funeral-notices-${VERSION}.zip" \
            --arg last_updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg changelog    "$CHANGELOG" \
            '{
              name:         "HumanKind Funeral Notices",
              slug:         "hk-funeral-notices",
              version:      $version,
              download_url: $download_url,
              requires:     "6.6",
              requires_php: "8.1",
              tested:       "6.8",
              last_updated: $last_updated,
              homepage:     "https://humankindwebsites.com/plugins/funeral-notices/",
              author:       "Weave Digital Studio",
              sections:     { changelog: $changelog }
            }' > update.json
          cat update.json

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build-release/hk-funeral-notices-${{ env.VERSION }}.zip
            update.json
          name: "HK Funeral Notices ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Verify the manifest is reachable at the stable URL"
        run: |
          URL="https://github.com/${{ github.repository }}/releases/latest/download/update.json"
          echo "Checking ${URL}"
          sleep 5
          SERVED=$(curl -sSL --max-time 30 "$URL" || true)
          echo "$SERVED"
          SERVED_VERSION=$(printf '%s' "$SERVED" | jq -r '.version // empty' 2>/dev/null || true)
          EXPECTED="${VERSION#v}"
          if [ "$SERVED_VERSION" != "$EXPECTED" ]; then
            echo "::warning::Manifest at the latest URL reports '${SERVED_VERSION}', expected '${EXPECTED}'. Sites will fall back to the releases API until this resolves."
          else
            echo "Manifest is live and reports ${SERVED_VERSION}."
          fi
