name: Build Plugin Release
on:
  push:
	tags:
	  - "*"
jobs:
  build:
	runs-on: ubuntu-latest
	
	steps:
	  - name: Checkout code
		uses: actions/checkout@v3
	  
	  - name: Get the version
		id: get_version
		run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
	  
	  - name: Set up PHP
		uses: shivammathur/setup-php@v2
		with:
		  php-version: '8.0'
		  tools: composer
	  
	  # Uncomment if you have Composer dependencies
	  # - name: Install dependencies
	  #   run: composer install --no-dev --optimize-autoloader
	  
	  - name: Create build directory
		run: mkdir -p build/hk-funeral-notices
	  
	  - name: Copy plugin files to build directory
		run: |
		  rsync -av --exclude='.git' \
				  --exclude='.github' \
				  --exclude='build' \
				  --exclude='.gitignore' \
				  --exclude='composer.json' \
				  --exclude='composer.lock' \
				  --exclude='.DS_Store' \
				  --exclude='.nova' \
				  --exclude='node_modules' \
				  --exclude='package.json' \
				  --exclude='package-lock.json' \
				  --exclude='phpcs.xml' \
				  --exclude='phpunit.xml' \
				  --exclude='tests' \
				  --exclude='DEVELOPMENT-NOTES.md' \
				  --exclude='MIGRATION.md' \
				  --exclude='CLAUDE.md' \
				  --exclude='WARP.md' \
				  . build/hk-funeral-notices/
	  
	  - name: Create zip file
		run: cd build && zip -r hk-funeral-notices-${{ env.VERSION }}.zip hk-funeral-notices
	  
	  - name: Create GitHub release
		uses: softprops/action-gh-release@v1
		with:
		  files: build/hk-funeral-notices-${{ env.VERSION }}.zip
		env:
		  GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_PAT }}
	
	  - name: Validate plugin header
		run: |
		  if ! grep -q "Version: " build/hk-funeral-notices/hk-funeral-notices.php; then
			echo "Warning: Plugin version header not found"
		  fi