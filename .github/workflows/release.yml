name: Build and Release - Dual System (GitHub + Hoster)

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: "Build and release plugin for GitHub + Hoster"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"

      - name: "Get the version"
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Build assets"
        run: npm run build

      - name: "Create build directory"
        run: mkdir -p build-release/hk-funeral-notices

      - name: "Copy plugin files to build directory"
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build-release' \
            --exclude='node_modules' \
            --exclude='src/js' \
            --exclude='.gitignore' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='webpack.scripts.config.js' \
            --exclude='phpcs.xml.dist' \
            --exclude='blueprint.json' \
            --exclude='CLAUDE.md' \
            --exclude='PROJECT-STATE-SUMMARY.md' \
            --exclude='ANALYTICS-COLLECTION-EXTENSION.md' \
            --exclude='INCIDENT-REPORT-NOV-21-2025.md' \
            --exclude='COLLECTION-MANAGEMENT-FEATURE.md' \
            --exclude='.DS_Store' \
            --exclude='.nova' \
            --exclude='.claude' \
            --exclude='screenshots' \
            . build-release/hk-funeral-notices/

      - name: "Create zip file"
        run: |
          cd build-release
          zip -r hk-funeral-notices-${{ env.VERSION }}.zip hk-funeral-notices

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: build-release/hk-funeral-notices-${{ env.VERSION }}.zip
          name: "HK Funeral Notices ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Notify Hoster System"
        if: success()
        run: |
          echo "=== Hoster Integration ==="
          echo "GitHub release created successfully!"
          echo "Release: ${{ github.ref_name }}"
          echo "Download URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/hk-funeral-notices-${{ env.VERSION }}.zip"
          echo ""
          echo "Manual Step Required:"
          echo "1. Update hoster system at https://humankindwebsites.com/wp-admin/"
          echo "2. Point download to GitHub release URL above"
          echo "3. Update version number in hoster system"
